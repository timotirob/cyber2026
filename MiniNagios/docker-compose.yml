services:
  # 1. Moteur d'application Web PHP (Apache + Ext BDD PostgreSQL)
  web-php:
    build: .
    container_name: nagios_php_server
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html

  # 2. Serveur de Base de Données Relationnelle PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: nagios_postgres
    # Les identifiants viennent du fichier .env, que Docker Compose lit tout seul
    # dans le dossier du docker-compose.yml. Ce fichier est exclu de Git (voir
    # .gitignore) : le dépôt ne contient donc plus aucun mot de passe.
    # Le modèle à recopier se trouve dans .env.example.
    #
    # ATTENTION : c'est bien le compte SUPERUTILISATEUR qui est créé ici, à
    # l'initialisation du conteneur. L'application, elle, se connecte avec
    # DB_USER / DB_PASS — un compte restreint distinct. Mélanger les deux
    # reviendrait à faire tourner l'application en superutilisateur, ce que
    # la séance 3 (moindre privilège) interdit précisément.
    environment:
      POSTGRES_USER: ${DB_SUPER_USER}
      POSTGRES_PASSWORD: ${DB_SUPER_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 3. Serveur SMTP de Capture de Mails (Dev/Cybersécurité)
  mail-server:
    image: axllent/mailpit
    container_name: nagios_mailpit
    ports:
      - "8027:8025"

  # 4. Serveur NoSQL de Cache et de Session (Redis)
  redis-cache:
    image: redis:7-alpine
    container_name: nagios_redis
    ports:
      - "6380:6379"

  # 5. L'Outil CLI Composer (Pour installer Symfony et les Packages)
  composer:
    image: composer:latest
    container_name: nagios_composer
    volumes:
      - ./projets_php:/app

# 🌟 LA LIGNE MANQUANTE QUI CAUSAIT L'ERREUR :
volumes:
  postgres_data: